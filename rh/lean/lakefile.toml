# rh/lean -- the RH-program Lean 4 formalization pilot (r267 recommendation).
#
# mathlib is pinned to the SAME tag as the sibling project
# experiments/lean4-carrier-rigidity (v4.29.1) so both share the elan
# toolchain and the local mathlib olean cache.  mathlib is REQUIRED here:
# core Lean 4 has neither the algebra hierarchy (Field / LinearOrder /
# IsStrictOrderedRing) nor the `ring` / `field_simp` tactics that the
# proved layer (RH/Recursion.lean) uses, and the Inertia layer states
# matrix theorems against Mathlib.LinearAlgebra.Matrix.

name = "RH"
defaultTargets = ["RH"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.1"

[[lean_lib]]
name = "RH"
