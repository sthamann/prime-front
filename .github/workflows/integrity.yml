name: Independent source integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash build.sh audit
      - name: Formal-support source audit (no Lean compilation)
        working-directory: experiments/lean4-carrier-rigidity
        run: bash scripts/audit.sh --quick
